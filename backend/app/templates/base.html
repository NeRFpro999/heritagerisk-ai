<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HeritageRisk AI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <header>
    <nav class="navbar">
      <a class="brand" href="/">
        <span class="brand-icon">&#9670;</span> HeritageRisk AI
      </a>
      <ul class="nav-links">
        <li><a href="/">Dashboard</a></li>
        <li><a href="/sites">Sites</a></li>
        <li><a href="/cases">Cases</a></li>
      </ul>
      <a class="btn-primary btn-sm nav-cta" href="/sites/new">+ Add Site</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-brand">&#9670; HeritageRisk AI</span>
      <span class="footer-note">
        Visible damage triage for heritage sites &mdash;
        AI output is for human review only. It does not replace professional assessment.
      </span>
    </div>
  </footer>

</body>
</html>
