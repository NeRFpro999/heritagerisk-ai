{% extends "base.html" %}
{% block title %}Report — Case #{{ case.id }} — HeritageRisk AI{% endblock %}

{% block content %}
<div class="page-header">

  <a class="btn-secondary" href="/cases/{{ case.id }}">Back to Case</a>

</div>
{% endblock %}
